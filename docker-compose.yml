services:
  web:
    build: .
    container_name: mediccrm_backend
    env_file:
      - .env
    ports:
      - "8004:8000"
    volumes:
      - .:/app
      - ./media:/app/media
      - ./static:/app/static
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: mediccrm_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
